<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations!</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4e4c3;
            padding-top: 50px;
        }
        h1 {
            color: #4CAF50;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            font-size: 18px;
        }
        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>🎉 Congratulations! 🎉</h1>
    <p>You have completed the level.</p>

    <button class="btn" onclick="playClickSound(); retryLevel()">Retry</button>
    <button class="btn" onclick="playClickSound(); nextLevel()">Next</button>

    <audio id="clickSound" src="click.mp3"></audio>

    <script>
        const maxLevel = 10;

        function playClickSound() {
            const sound = document.getElementById("clickSound");
            sound.play();
        }

        function retryLevel() {
            let currentLevel = localStorage.getItem("currentLevel") || 1;
            window.location.href = "game.html?level=" + currentLevel;
        }

        function nextLevel() {
            let currentLevel = parseInt(localStorage.getItem("currentLevel")) || 1;
            let nextLevel = currentLevel < maxLevel ? currentLevel + 1 : maxLevel;
            localStorage.setItem("currentLevel", nextLevel);
            window.location.href = `game.html?level=${nextLevel}`;
        }
    </script>

</body>
</html>
